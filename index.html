<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>155 UASU BAF | Office Management System</title>
    <meta name="description" content="Military personnel duty register, parade state tracker, TDY register, and monthly roster management system for 155 UASU BAF BASE ZHR." />
    <meta property="og:title" content="155 UASU BAF | Office Management System" />
    <meta property="og:description" content="Military personnel duty register, parade state tracker, TDY register, and monthly roster management system for 155 UASU BAF BASE ZHR." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700;800;900&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link id="pwa-icon-32" rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=26" />
    <link id="pwa-icon-48" rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png?v=26" />
    <link id="pwa-icon-192" rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192-trans.png?v=26" />
    <link id="pwa-icon-512" rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512-trans.png?v=26" />
    <link id="pwa-apple-icon" rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=26" />
    <link id="pwa-manifest-link" rel="manifest" href="/api/pwa-manifest?v=26" />
    <script>
      (function () {
        try {
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js?v=27').catch(function () {});
          }
          var hasSession = false;
          try {
            hasSession = Boolean(window.sessionStorage && window.sessionStorage.getItem('baf_user_session'));
          } catch (e) {}

          var officeName = '155 UASU BAF';
          var officeLogo = hasSession ? '/155-uasu-baf-logo.png?v=26' : '/office-management-logo.png?v=26';
          var iconHash = '';
          var rawCfg = localStorage.getItem('custom_office_config') || localStorage.getItem('baf_custom_office_config');
          if (rawCfg) {
            var cfg = JSON.parse(rawCfg);
            if (cfg && cfg.officeName && cfg.officeName !== 'Office Management') {
              officeName = String(cfg.officeName).trim();
            }
            if (hasSession && cfg && cfg.officeLogo) {
              officeLogo = String(cfg.officeLogo).trim();
            }
          }
          var rawMeta = localStorage.getItem('baf_pwa_active_office_meta');
          if (rawMeta) {
            var meta = JSON.parse(rawMeta);
            if (meta && meta.officeName && meta.officeName !== 'Office Management' && meta.officeName !== 'Office Management Application') {
              officeName = String(meta.officeName).trim();
            }
            if (hasSession && meta && (meta.icon192Url || meta.rawLogo)) {
              officeLogo = String(meta.icon192Url || meta.rawLogo).trim();
            }
            if (meta && meta.iconHash) {
              iconHash = String(meta.iconHash).trim();
            }
          }
          var shortName = officeName.length > 12 ? officeName.slice(0, 12).trim() : officeName;
          var manifestEl = document.getElementById('pwa-manifest-link');
          if (manifestEl) {
            var q = 'name=' + encodeURIComponent(officeName) + '&short_name=' + encodeURIComponent(shortName) + '&v=27';
            if (iconHash) q += '&iconHash=' + encodeURIComponent(iconHash);
            if (officeLogo && officeLogo.indexOf('data:') !== 0) q += '&logo=' + encodeURIComponent(officeLogo);
            manifestEl.setAttribute('href', '/api/pwa-manifest?' + q);
          }
          var el32 = document.getElementById('pwa-icon-32');
          var el48 = document.getElementById('pwa-icon-48');
          var el192 = document.getElementById('pwa-icon-192');
          var el512 = document.getElementById('pwa-icon-512');
          var elApple = document.getElementById('pwa-apple-icon');
          if (el32) el32.setAttribute('href', officeLogo);
          if (el48) el48.setAttribute('href', officeLogo);
          if (el192) el192.setAttribute('href', officeLogo);
          if (el512) el512.setAttribute('href', officeLogo);
          if (elApple) elApple.setAttribute('href', officeLogo);
        } catch (e) {}
      })();
    </script>
    <style>
      /* Hide scrollbars across all browsers, Android WebView, and APK */
      *, *::before, *::after, html, body, #root {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      ::-webkit-scrollbar,
      *::-webkit-scrollbar,
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      #root::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
        -webkit-appearance: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
      ::-webkit-scrollbar-thumb,
      *::-webkit-scrollbar-thumb,
      html::-webkit-scrollbar-thumb,
      body::-webkit-scrollbar-thumb {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
      }
      ::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track {
        display: none !important;
        background: transparent !important;
      }
      ::-webkit-scrollbar-corner,
      *::-webkit-scrollbar-corner {
        display: none !important;
        background: transparent !important;
      }
    </style>
    <meta name="theme-color" content="#020617" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="155 UASU BAF" />
    <style>
      html, body {
        background-color: #020617 !important;
        color: #f8fafc !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      @keyframes baf_pulse_anim {
        0% { left: -50%; width: 50%; }
        50% { left: 25%; width: 60%; }
        100% { left: 100%; width: 50%; }
      }
    </style>
  </head>
  <body style="background-color: #020617; color: #f8fafc; margin: 0; min-height: 100vh;">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
